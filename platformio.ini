[platformio]
src_dir = firmware/LedPanelWiFi_v1.14
data_dir = firmware/LedPanelWiFi_v1.14/data
default_envs = esp32
lib_dir = libraries
extra_configs =
  user_*.ini


[esp32_base]
framework = arduino
platform = espressif32
;platform = espressif32@5.3.0  ; Arduino Core v2.0.6 IDF 4.4.3
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
;board_build.partitions = esp32_4MiB.csv
lib_ignore =
  ESPAsyncTCP
  ESPAsyncUDP
  DFMiniMp3
  LittleFS_esp32

[esp8266_base]
framework = arduino
platform = espressif8266
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
upload_speed = 460800                                                                                                                                         
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_ignore =
  LittleFS_esp32
  AsyncTCP


[env:esp32]
extends = esp32_base
board = wemos_d1_mini32

[env:esp8266]
extends = esp8266_base
board = d1_mini

[env:esp32_s2_mini]
extends = esp32_base
; Arduino 2.0.17 + FastLED 3.6.0: the combination recommended by this sketch.
platform = espressif32@6.13.0
board = lolin_s2_mini
board_build.partitions = esp32_4MiB.csv
build_flags =
  -DPANEL_PROFILE_S2_MINI=1
  -D_IR_ENABLE_DEFAULT_=false
  -DDECODE_HASH=true
  -DDECODE_NEC=true
  -DDECODE_SONY=true
  -DDECODE_RC5=true
  -DDECODE_RC6=true
  -DDECODE_SAMSUNG=true
  -DDECODE_PANASONIC=true
  -DDECODE_JVC=true
  -DDECODE_LG=true
lib_deps = crankyoldgit/IRremoteESP8266@2.8.6
lib_extra_dirs = .pio/vendor/s2_mini
upload_speed = 460800
; Native USB: enter ROM download mode with BOOT + RESET before uploading.
; Avoid the 1200-baud touch/new-port wait, which can lose the selected port.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
